plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'com.modrinth.minotaur' version '2.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

// The loader-independent code lives in ../common and is compiled straight into this jar.
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

// Minecraft 26.1+ runs on Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Forge 1.21.6+ builds with ForgeGradle 7, which follows the layout of its MDK.
minecraft {

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        register('client') {
            // The jar lists its mixins in the manifest; a dev run reads classes from folders
            args '-mixin.config=stackstorage.mixins.json'
        }
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // Checks @SubscribeEvent methods against EventBus 7 at compile time
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'stackstorage.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Publish to Modrinth with: ./gradlew :forge:modrinth
// Requires MODRINTH_TOKEN env var (create at https://modrinth.com/settings/pats)
// and the project created once on modrinth.com (slug below must match).
modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = 'stack-storage'
    versionNumber = mod_version
    versionName = "StackStorage ${mod_version} for Forge ${minecraft_version}"
    versionType = 'release'
    uploadFile = jar
    gameVersions = ['26.1', '26.1.1', '26.1.2']
    loaders = ['forge']
    changelog = rootProject.file('CHANGELOG.md').exists() ? rootProject.file('CHANGELOG.md').text : 'See commit history.'
}
